name: Denetim

on:
  pull_request:
  push:
    branches: [main]

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/rehber_denetle.py --kontrol
      - run: mkdocs build --strict
